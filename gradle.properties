org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.enableJetifier=false
android.useAndroidX=true
# SebType (#58): task outputs are reused from ~/.gradle's build cache (shared by every worktree), and the
# configured build is reused while build.gradle and its inputs stay the same.
org.gradle.caching=true
org.gradle.configuration-cache=true
