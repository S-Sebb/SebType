# SebType's Weasel (小狼毫) installer for Windows Chinese (#13): pc/windows/weasel/build.ps1 builds
# pc/weasel and engines/librime on a Windows runner, with the tray icons made from pc/icons. The installer and perf-rime.exe are the run's
# artifact "sebtype-weasel"; its librime and Rime's shared data are "sebtype-rime", which windows-setup.yml
# builds SebType's text service with and packs into SebType-setup.exe (#73, #190).
name: Weasel

on:
  workflow_dispatch:
  workflow_call:  # windows-setup.yml packs the installer into SebType's setup
  push:
    paths:
      - pc/windows/weasel/**
      - pc/weasel/**
      - engines/librime/**
      - pc/icons/**
      - windows/data/**
      - pc/linux/perf-rime.c
      - .github/workflows/weasel.yml
      - .github/apt-install.sh

permissions:
  contents: read

jobs:
  icons:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: .github/apt-install.sh librsvg2-bin python3-pil
      - run: python3 pc/windows/weasel/make-icons.py out/icons
      - uses: actions/upload-artifact@v4
        with:
          name: weasel-icons
          path: out/icons
          if-no-files-found: error

  build:
    needs: icons
    runs-on: windows-2022
    env:
      BOOST_ROOT: ${{ github.workspace }}\deps\boost_1_84_0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: weasel-icons
          path: out/icons
      # What a build makes depends only on the paths that start this workflow: a push that changes none of
      # them takes the last build's output (#190: the build is half of windows-setup.yml's time).
      - uses: actions/cache@v4
        id: built
        with:
          path: out/weasel
          key: weasel-build-${{ hashFiles('pc/windows/weasel/**', 'pc/weasel/**', 'engines/librime/**', 'pc/icons/**', 'windows/data/**', 'pc/linux/perf-rime.c', '.github/workflows/weasel.yml') }}
      - uses: actions/cache@v4
        if: steps.built.outputs.cache-hit != 'true'
        with:
          path: ${{ env.BOOST_ROOT }}
          key: boost-1.84.0-msvc-14.3-weasel-0.17.4
      - name: Build
        if: steps.built.outputs.cache-hit != 'true'
        shell: pwsh
        run: pc/windows/weasel/build.ps1 -Icons out/icons -Out out/weasel
      - uses: actions/upload-artifact@v4
        with:
          name: sebtype-weasel
          path: out/weasel/*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: sebtype-rime
          path: out/weasel/rime
          if-no-files-found: error
