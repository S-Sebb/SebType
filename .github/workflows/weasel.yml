# SebType's Weasel (小狼毫) installer for Windows Chinese (#13): pc/windows/weasel/build.ps1 builds
# pc/weasel and pc/librime on a Windows runner, with the tray icons made from pc/icons. The installer and perf-rime.exe are the run's
# artifact "sebtype-weasel"; windows-setup.yml packs the installer into SebType-setup.exe (#73).
name: Weasel

on:
  workflow_dispatch:
  workflow_call:  # windows-setup.yml packs the installer into SebType's setup
  push:
    paths:
      - pc/windows/weasel/**
      - pc/weasel/**
      - pc/librime/**
      - pc/icons/**
      - pc/linux/perf-rime.c
      - .github/workflows/weasel.yml
      - .github/apt-install.sh

permissions:
  contents: read

jobs:
  icons:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: .github/apt-install.sh librsvg2-bin python3-pil
      - run: python3 pc/windows/weasel/make-icons.py out/icons
      - uses: actions/upload-artifact@v4
        with:
          name: weasel-icons
          path: out/icons
          if-no-files-found: error

  build:
    needs: icons
    runs-on: windows-2022
    env:
      BOOST_ROOT: ${{ github.workspace }}\deps\boost_1_84_0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: weasel-icons
          path: out/icons
      - uses: actions/cache@v4
        with:
          path: ${{ env.BOOST_ROOT }}
          key: boost-1.84.0-msvc-14.3-weasel-0.17.4
      - name: Build
        shell: pwsh
        run: pc/windows/weasel/build.ps1 -Icons out/icons -Out out/weasel
      - uses: actions/upload-artifact@v4
        with:
          name: sebtype-weasel
          path: out/weasel/*.exe
          if-no-files-found: error
