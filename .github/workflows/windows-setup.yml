# SebType's Windows installer (#73): SebType-setup-<version>.exe, built with Inno Setup from
# pc/windows/setup/sebtype.iss. It packs SebType's text service and server (windows/, over core/, #190)
# with the librime that weasel.yml builds and Rime's shared data, the Chinese data (data/rime/build.sh),
# Mozc's server from SebType's Mozc (engines/mozc, built by pc/windows/mozc/build.ps1), the Configurator
# (configurator.yml) and the installer's pictures (pc/windows/setup/pictures.py). The setup is the
# run's artifact "sebtype-setup"; pc/windows/setup/test-tcsbackend.sh tests it.
name: Windows setup

on:
  workflow_dispatch:
  pull_request:
    paths: &paths
      - windows/**
      - core/**
      - pc/windows/**
      - pc/weasel/**
      - engines/librime/**
      - engines/mozc/**
      - pc/icons/**
      - pc/configurator/**
      - pc/linux/mozc-keymap.tsv
      - pc/linux/perf-rime.c
      - data/rime/**
      - art/make-icon.py
      - art/fonts/**
      - art/icon.png
      - .github/workflows/windows-setup.yml
      - .github/workflows/weasel.yml
      - .github/workflows/configurator.yml
      - .github/apt-install.sh
  push:
    branches: [main]
    paths: *paths

permissions:
  contents: read

jobs:
  weasel:
    uses: ./.github/workflows/weasel.yml

  configurator:
    uses: ./.github/workflows/configurator.yml

  service:
    needs: weasel
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sebtype-rime
          path: in/rime
      # vcpkg's protobuf build takes most of a cold run; its packages depend only on the runner's vcpkg.
      - run: New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
      - uses: actions/cache@v4
        with:
          path: vcpkg-cache
          key: vcpkg-protobuf-x64-windows-static-${{ runner.os }}-${{ hashFiles('windows/build.ps1') }}
          restore-keys: vcpkg-protobuf-x64-windows-static-${{ runner.os }}-
      - name: Build
        run: windows/build.ps1 -Rime in/rime -Out out/service
      - uses: actions/upload-artifact@v4
        with:
          name: sebtype-service
          path: out/service
          if-no-files-found: error

  rime-data:
    runs-on: ubuntu-24.04
    # Fedora has librime 1.16.1, the version Weasel and the phone run, so they take the tables as built.
    container: fedora:44
    steps:
      - run: dnf install -q -y git librime librime-lua opencc gcc gcc-c++ curl unzip zip python3 diffutils findutils
      - uses: actions/checkout@v4
      - run: data/rime/build.sh out
      - uses: actions/upload-artifact@v4
        with:
          name: rime-data
          path: out/rime/rime-data.zip
          if-no-files-found: error

  pictures:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: .github/apt-install.sh librsvg2-bin python3-pil python3-numpy fonts-noto-cjk
      - run: python3 pc/windows/setup/pictures.py out/pictures
      - uses: actions/upload-artifact@v4
        with:
          name: setup-pictures
          path: out/pictures
          if-no-files-found: error

  mozc:
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      # The MSI depends only on these; a run with the same ones reuses it, a PR's run main's.
      - id: inputs
        run: |
          "hash=${{ hashFiles('engines/mozc/**', 'pc/windows/mozc/versions.psd1', 'pc/windows/mozc/build.ps1', 'pc/windows/mozc/make_icons.py', 'pc/icons/**') }}" >> $env:GITHUB_OUTPUT
      - uses: actions/cache@v4
        id: cache
        with:
          path: out/mozc
          key: mozc-msi-${{ steps.inputs.outputs.hash }}
      - uses: actions/setup-python@v5
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          python-version: '3.13'
      # Building Qt takes most of a cold build (#154), and Qt depends only on Mozc's Qt pin and
      # build_qt.py: the key is theirs, read from engines/mozc.
      - name: Qt's key
        id: qt
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          $pin = (Select-String -Path engines/mozc/src/build_tools/update_deps.py -Pattern 'qtbase-everywhere-src').Line
          $key = $pin + (Get-Content -Raw engines/mozc/src/build_tools/build_qt.py)
          "key=mozc-qt-$([Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes($key))))" >> $env:GITHUB_OUTPUT
      - uses: actions/cache@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          path: D:\m\mozc\src\third_party\qt
          key: ${{ steps.qt.outputs.key }}
      # Bazel's caches from main's last build, so a change to engines/mozc recompiles only what it touches.
      - uses: actions/cache/restore@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          path: D:\m\bazel-cache
          key: mozc-bazel-${{ steps.inputs.outputs.hash }}
          restore-keys: mozc-bazel-
      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          $start = Get-Date
          $msi = pc/windows/mozc/build.ps1 -WorkDir D:\m -BazelCache D:\m\bazel-cache | Select-Object -Last 1
          New-Item -ItemType Directory -Force out/mozc | Out-Null
          Copy-Item $msi out/mozc/
          # Bazel marks the disk cache entries it reads or writes; the rest are from older sources and
          # would only grow the saved cache.
          $old = Get-ChildItem -Recurse -File D:\m\bazel-cache\disk | Where-Object LastWriteTime -lt $start
          $old | Remove-Item
          $left = Get-ChildItem -Recurse -File D:\m\bazel-cache | Measure-Object -Sum Length
          Write-Host "Bazel cache: dropped $(@($old).Count) unused entries, kept $($left.Count) ($([int]($left.Sum / 1MB)) MB)"
      # Only main's (and a manual run's) builds are saved: PRs build on main's, and each saved cache
      # takes GBs of the repository's cache space.
      - uses: actions/cache/save@v4
        if: steps.cache.outputs.cache-hit != 'true' && github.event_name != 'pull_request'
        with:
          path: D:\m\bazel-cache
          key: mozc-bazel-${{ steps.inputs.outputs.hash }}
      - uses: actions/upload-artifact@v4
        with:
          name: sebtype-mozc
          path: out/mozc/*.msi
          if-no-files-found: error

  setup:
    needs: [weasel, configurator, rime-data, pictures, mozc, service]
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: in
      # Python's embeddable package for the Configurator's sync (#180), pinned in python.ps1.
      - uses: actions/cache@v4
        with:
          path: in/python
          key: python-embed-${{ hashFiles('pc/windows/setup/python.ps1') }}
      - name: Python
        run: pc/windows/setup/python.ps1 -Dir in/python
      # Japanese needs only Mozc's server: SebType's text service replaces Mozc's own (#190).
      - name: Mozc's server
        run: |
          $msi = (Get-Item in/sebtype-mozc/*.msi).FullName
          $p = Start-Process -Wait -PassThru msiexec "/a `"$msi`" /qn TARGETDIR=`"$PWD\in\mozc-msi`""
          if ($p.ExitCode) { throw "msiexec /a failed ($($p.ExitCode))" }
          $server = Get-ChildItem -Recurse in/mozc-msi -Filter mozc_server.exe | Select-Object -First 1
          if (-not $server) { throw "no mozc_server.exe in $msi" }
          New-Item -ItemType Directory -Force in/mozc-server | Out-Null
          # With the C++ runtime it was built with, which Mozc installs next to it: Windows' own may be older,
          # and mozc_server then never starts (TCSBackEnd's is).
          Copy-Item $server.FullName, "$($server.DirectoryName)\msvcp140*.dll", "$($server.DirectoryName)\vcruntime140*.dll" in/mozc-server/
          if (-not (Test-Path in/mozc-server/vcruntime140.dll)) { throw "no C++ runtime next to mozc_server.exe in $msi" }
      - name: Inno Setup
        run: |
          $exe = "$env:RUNNER_TEMP\innosetup.exe"
          curl.exe -sSfL -o $exe https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe
          if ((Get-FileHash $exe).Hash -ne 'a549929319f9120716677c685535ca4671e4b937b5fdc87e2585f32d8eb30e8c') { throw 'Inno Setup: checksum mismatch' }
          Start-Process -Wait $exe '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', "/DIR=$env:RUNNER_TEMP\inno"
      - name: Build
        run: |
          & "$env:RUNNER_TEMP\inno\ISCC.exe" /Qp "/DBuild=${{ github.run_number }}" "/DIn=$PWD\in" pc/windows/setup/sebtype.iss
          if ($LASTEXITCODE) { throw "ISCC failed ($LASTEXITCODE)" }
      - uses: actions/upload-artifact@v4
        with:
          name: sebtype-setup
          path: pc/windows/setup/out/*.exe
          if-no-files-found: error
