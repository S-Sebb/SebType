# SebType's Windows installer (#73): SebType-setup-<version>.exe, built with Inno Setup from
# pc/windows/setup/sebtype.iss. It packs SebType's text service and server (windows/, over core/, #190)
# with SebType's librime and Rime's shared data (pc/windows/rime/build.ps1), the Chinese data
# (data/rime/build.sh), Mozc (sebtype-mozc.dll from engines/mozc, by pc/windows/mozc/build.ps1), the Configurator
# (configurator.yml) and the installer's pictures (pc/windows/setup/pictures.py). The setup is the
# run's artifact "sebtype-setup"; pc/windows/setup/test-tcsbackend.sh tests it.
# The account's artifact storage is shared (#418): what only the setup job packs is kept 1 day; the setup,
# perf-rime and the Configurator (the tests and docs/install.md download them) 14 days from main, 3 from PRs.
name: Windows setup

on:
  workflow_dispatch:
  pull_request:
    paths: &paths
      - VERSION
      - windows/**
      - core/**
      - pc/windows/**
      - engines/librime/**
      - engines/mozc/**
      - engines/sebtype-lm/**
      - pc/icons/**
      - pc/configurator/**
      - pc/linux/mozc-keymap.tsv
      - pc/linux/perf-rime.c
      - data/rime/**
      - art/make-icon.py
      - art/fonts/**
      - art/icon.png
      - .github/workflows/windows-setup.yml
      - .github/workflows/configurator.yml
      - .github/apt-install.sh
  push:
    branches: [main]
    paths: *paths

permissions:
  contents: read

jobs:
  # SebType's librime with its plugins, Rime's shared data, and perf-rime.exe for the performance runs (#54).
  rime:
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    env:
      BOOST_ROOT: ${{ github.workspace }}\deps\boost_1_84_0
    steps:
      - uses: actions/checkout@v4
      # What the build makes depends only on these: a run that changes none of them takes the last build's.
      - uses: actions/cache@v4
        id: built
        with:
          path: out/rime
          key: rime-build-${{ hashFiles('pc/windows/rime/**', 'engines/librime/**', 'pc/linux/perf-rime.c') }}
      # librime takes only Boost's headers on Windows.
      - uses: actions/cache@v4
        if: steps.built.outputs.cache-hit != 'true'
        with:
          path: ${{ env.BOOST_ROOT }}
          key: boost-1.84.0-headers
      - name: Build
        if: steps.built.outputs.cache-hit != 'true'
        run: pc/windows/rime/build.ps1 -Out out/rime
      - uses: actions/upload-artifact@v4
        with:
          name: sebtype-rime
          path: out/rime/rime
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: perf-rime
          path: out/rime/perf-rime.exe
          if-no-files-found: error
          retention-days: ${{ github.ref == 'refs/heads/main' && 14 || 3 }}

  configurator:
    uses: ./.github/workflows/configurator.yml

  service:
    needs: rime
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sebtype-rime
          path: in/rime
      # vcpkg's protobuf build takes most of a cold run; its packages depend only on the runner's vcpkg.
      - run: New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
      - uses: actions/cache@v4
        with:
          path: vcpkg-cache
          key: vcpkg-protobuf-opencc-x64-windows-static-${{ runner.os }}-${{ hashFiles('windows/build.ps1') }}
          restore-keys: vcpkg-protobuf-opencc-x64-windows-static-${{ runner.os }}-
      - name: Build
        run: windows/build.ps1 -Rime in/rime -Out out/service
      - uses: actions/upload-artifact@v4
        with:
          name: sebtype-service
          path: out/service
          if-no-files-found: error
          retention-days: 1

  rime-data:
    runs-on: ubuntu-24.04
    # Fedora has librime 1.16.1, the version SebType's Windows librime and the phone run, so they take the tables as built.
    container: fedora:44
    steps:
      - run: dnf install -q -y git librime librime-lua opencc gcc gcc-c++ curl unzip zip python3 diffutils findutils
      - uses: actions/checkout@v4
      - run: data/rime/build.sh out
      - uses: actions/upload-artifact@v4
        with:
          name: rime-data
          path: out/rime/rime-data.zip
          if-no-files-found: error
          retention-days: 1

  pictures:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: .github/apt-install.sh python3-pil python3-numpy fonts-noto-cjk
      - run: python3 pc/windows/setup/pictures.py out/pictures
      - uses: actions/upload-artifact@v4
        with:
          name: setup-pictures
          path: out/pictures
          if-no-files-found: error
          retention-days: 1

  mozc:
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      # The DLL depends only on these; a run with the same ones reuses it, a PR's run main's.
      - id: inputs
        run: |
          "hash=${{ hashFiles('engines/mozc/**', 'pc/windows/mozc/**') }}" >> $env:GITHUB_OUTPUT
      - uses: actions/cache@v4
        id: cache
        with:
          path: out/mozc
          key: mozc-dll-${{ steps.inputs.outputs.hash }}
      - uses: actions/setup-python@v5
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          python-version: '3.13'
      # Bazel's caches from main's last build, so a change to engines/mozc recompiles only what it touches.
      - uses: actions/cache/restore@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          path: D:\m\bazel-cache
          key: mozc-bazel-${{ steps.inputs.outputs.hash }}
          restore-keys: mozc-bazel-
      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          $start = Get-Date
          $mozc = pc/windows/mozc/build.ps1 -WorkDir D:\m -BazelCache D:\m\bazel-cache | Select-Object -Last 1
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item -Recurse $mozc out/mozc
          # Bazel marks the disk cache entries it reads or writes; the rest are from older sources and
          # would only grow the saved cache.
          $old = Get-ChildItem -Recurse -File D:\m\bazel-cache\disk | Where-Object LastWriteTime -lt $start
          $old | Remove-Item
          $left = Get-ChildItem -Recurse -File D:\m\bazel-cache | Measure-Object -Sum Length
          Write-Host "Bazel cache: dropped $(@($old).Count) unused entries, kept $($left.Count) ($([int]($left.Sum / 1MB)) MB)"
      # Only main's (and a manual run's) builds are saved: PRs build on main's, and each saved cache
      # takes GBs of the repository's cache space.
      - uses: actions/cache/save@v4
        if: steps.cache.outputs.cache-hit != 'true' && github.event_name != 'pull_request'
        with:
          path: D:\m\bazel-cache
          key: mozc-bazel-${{ steps.inputs.outputs.hash }}
      # The DLL loads in a process of its own and converts (as in sebtype-server.exe): its C interface, its
      # built-in dictionary and Mozc's Windows code without mozc_server around it (#233).
      - name: Convert
        run: |
          $o = "nihongo`t日本語", "toukyou`t東京" | python -I pc/linux/perf-mozc.py out/mozc/sebtype-mozc.dll "$env:RUNNER_TEMP\mozc-profile" 1
          $o
          if ($LASTEXITCODE -or -not ($o -contains 'top1=2/2')) { throw 'Mozc in sebtype-mozc.dll did not convert' }
      - uses: actions/upload-artifact@v4
        with:
          name: mozc
          path: out/mozc
          if-no-files-found: error
          retention-days: 1

  setup:
    needs: [rime, configurator, rime-data, pictures, mozc, service]
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: in
      # Python's embeddable package for the Configurator's sync (#180), pinned in python.ps1.
      - uses: actions/cache@v4
        with:
          path: in/python
          key: python-embed-${{ hashFiles('pc/windows/setup/python.ps1') }}
      - name: Python
        run: pc/windows/setup/python.ps1 -Dir in/python
      # The Chinese data's licence and sources, which Setup installs in licenses\ (#544).
      - run: tar -xf in/rime-data/rime-data.zip -C in/rime-data LICENSE SOURCE.txt
      - name: Inno Setup
        run: |
          $exe = "$env:RUNNER_TEMP\innosetup.exe"
          curl.exe --limit-rate 35M -sSfL -o $exe https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe
          if ((Get-FileHash $exe).Hash -ne 'a549929319f9120716677c685535ca4671e4b937b5fdc87e2585f32d8eb30e8c') { throw 'Inno Setup: checksum mismatch' }
          Start-Process -Wait $exe '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', "/DIR=$env:RUNNER_TEMP\inno"
      - name: Build
        run: |
          & "$env:RUNNER_TEMP\inno\ISCC.exe" /Qp "/DBuild=${{ github.run_number }}" "/DIn=$PWD\in" pc/windows/setup/sebtype.iss
          if ($LASTEXITCODE) { throw "ISCC failed ($LASTEXITCODE)" }
      - uses: actions/upload-artifact@v4
        with:
          name: sebtype-setup
          path: pc/windows/setup/out/*.exe
          if-no-files-found: error
          retention-days: ${{ github.ref == 'refs/heads/main' && 14 || 3 }}
      # Setup run from a PowerShell 7 shell, as this step's is: the Windows PowerShell 5.1 its steps start
      # must not take PowerShell 7's PSModulePath and fail to load its own modules (#299).
      - name: Install from pwsh
        run: |
          $exe = Get-Item pc/windows/setup/out/*.exe
          $p = Start-Process -Wait -PassThru $exe '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=$env:RUNNER_TEMP\install.log"
          if ($p.ExitCode) {
            Get-Content "$env:RUNNER_TEMP\install.log" -Tail 40
            Get-Content "$env:LOCALAPPDATA\SebType\setup.log", "$env:ProgramFiles\SebType\setup.log" -ErrorAction SilentlyContinue
            throw "Setup failed ($($p.ExitCode))"
          }
      # The licences it installed (#544): a folder per part, so that no library's text replaces another's
      # (librime's darts-clone is BSD-3-Clause, vcpkg's BSD-2-Clause), and none for what isn't linked.
      - name: Licences
        run: |
          $l = "$env:ProgramFiles\SebType\licenses"
          Get-ChildItem -Recurse -File $l | ForEach-Object { $_.FullName.Substring($l.Length + 1) }
          $missing = 'SebType-LICENSE.txt', 'Rime-data-GPL-3.0.txt', 'rime\librime-octagram-LICENSE.txt', 'rime\rime-prelude-LICENSE.txt',
            'server\llama.cpp-LICENSE.txt', 'server\protobuf-LICENSE.txt', 'mozc\Mozc-LICENSE.txt', 'mozc\WIL-LICENSE.txt' |
            Where-Object { -not (Test-Path "$l\$_") }
          if ($missing) { throw "missing: $missing" }
          if (-not (Select-String -Quiet 'Neither the name' "$l\rime\darts-clone-LICENSE.txt")) { throw "rime\darts-clone-LICENSE.txt isn't librime's" }
          if (Get-ChildItem -Recurse $l -Filter '*tclap*') { throw "tclap's licence: it isn't linked" }
      # A silent Setup and uninstall whose account steps fail exit instead of waiting on an error box nobody
      # can click (#311): /VERYSILENT alone, as pc/windows/README.md documents it. A file where the account's
      # %LOCALAPPDATA%\SebType folder goes makes setup.ps1 -User fail.
      - name: Silent Setup with a failing account step
        run: |
          Remove-Item -Recurse -Force "$env:LOCALAPPDATA\SebType"
          New-Item -ItemType File "$env:LOCALAPPDATA\SebType" | Out-Null
          $exe = Get-Item pc/windows/setup/out/*.exe
          $p = Start-Process -PassThru $exe '/VERYSILENT', '/NORESTART', "/LOG=$env:RUNNER_TEMP\install-fail.log"
          $null = $p.Handle  # so ExitCode is kept after WaitForExit
          if (-not $p.WaitForExit(300000)) { throw 'Setup still running after 5 minutes' }
          if ($p.ExitCode -ne 1) {
            Get-Content "$env:RUNNER_TEMP\install-fail.log" -Tail 40
            throw "Setup exited $($p.ExitCode), not 1"
          }
          # The uninstaller hands over to a copy of itself in %TEMP%, so wait for that one (as test.ps1 does).
          Start-Process "$env:ProgramFiles\SebType\unins000.exe" '/VERYSILENT', '/NORESTART'
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\{5C1E7A52-3D8B-4F7E-9E0B-7B3B5A1C7354}_is1'
          $end = (Get-Date).AddMinutes(5)
          while ((Test-Path $key) -or (Get-Process | Where-Object { $_.Path -like "$env:TEMP\*-uninstall.tmp\*" })) {
            if ((Get-Date) -gt $end) { throw 'Uninstaller still running after 5 minutes' }
            Start-Sleep 5
          }
