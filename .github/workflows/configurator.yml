# SebType Configurator for Windows (#72): pc/configurator built on a Windows runner with the phone's icon
# (art/make-icon.py) at every size, after its unit tests. The exe is the run's artifact "sebtype-configurator"; the installer (#73)
# ships it.
name: Configurator

on:
  workflow_dispatch:
  workflow_call:  # windows-setup.yml packs the exe into SebType's setup
  pull_request:
    paths:
      - pc/configurator/**
      - pc/icons/**
      - art/make-icon.py
      - art/icon.png
      - .github/workflows/configurator.yml
  push:
    branches: [main]
    paths:
      - pc/configurator/**
      - pc/icons/**
      - art/make-icon.py
      - art/icon.png
      - .github/workflows/configurator.yml

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
        working-directory: pc/configurator
    env:
      SEBTYPE_ICO: ${{ github.workspace }}\out\sebtype-configurator.ico
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            pc/configurator/target
          key: configurator-windows-${{ hashFiles('pc/configurator/Cargo.lock') }}
          restore-keys: configurator-windows-
      - name: Icon
        run: |
          python -m pip install --quiet pillow numpy
          python ../../art/make-icon.py --windows ../../out
          Move-Item -Force ../../out/sebtype.ico $env:SEBTYPE_ICO
      - run: cargo test --release --locked
      # The tests' build (#422), which takes a release served on 127.0.0.1: before the shipping one, so
      # target/release keeps that.
      - run: |
          cargo build --release --locked --features update-test
          Copy-Item target/release/sebtype-configurator.exe ../../out/sebtype-configurator-update-test.exe
      - run: cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: sebtype-configurator
          path: pc/configurator/target/release/sebtype-configurator.exe
          if-no-files-found: error
          retention-days: ${{ github.ref == 'refs/heads/main' && 14 || 3 }}
      - uses: actions/upload-artifact@v4
        with:
          name: sebtype-configurator-update-test
          path: out/sebtype-configurator-update-test.exe
          if-no-files-found: error
          retention-days: 1
