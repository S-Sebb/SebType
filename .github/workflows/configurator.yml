# SebType Configurator for Windows (#72): pc/configurator built on a Windows runner with the pig as its
# icon, after its unit tests. The exe is the run's artifact "sebtype-configurator"; the installer (#73)
# ships it.
name: Configurator

on:
  workflow_dispatch:
  pull_request:
    paths:
      - pc/configurator/**
      - pc/icons/**
      - .github/workflows/configurator.yml
  push:
    branches: [main]
    paths:
      - pc/configurator/**
      - pc/icons/**
      - .github/workflows/configurator.yml

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
        working-directory: pc/configurator
    env:
      SEBTYPE_ICO: ${{ github.workspace }}\out\sebtype-configurator.ico
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            pc/configurator/target
          key: configurator-windows-${{ hashFiles('pc/configurator/Cargo.lock') }}
          restore-keys: configurator-windows-
      - name: Icon
        run: |
          python -m pip install --quiet pillow
          New-Item -ItemType Directory -Force ../../out | Out-Null
          python -c "import sys; from PIL import Image; Image.open(sys.argv[1]).save(sys.argv[2], sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(192,192)])" `
            ../../sebtype/res-stable/mipmap-xxxhdpi/ic_launcher_round.png $env:SEBTYPE_ICO
      - run: cargo test --release --locked
      - run: cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: sebtype-configurator
          path: pc/configurator/target/release/sebtype-configurator.exe
          if-no-files-found: error
