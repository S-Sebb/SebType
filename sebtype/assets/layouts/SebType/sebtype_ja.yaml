# SebType: the same grid as English QWERTY; only the two bottom-row punctuation keys differ.
# Keys send , . - ? so Mozc turns them into 、 。 ー ？ in romaji input.
name: SebType Japanese QWERTY
languages: ja
imeHint: qwerty
rows:
  - letters: q w e r t y u i o p
  - letters: a s d f g h j k l
  - letters: $shift z x c v b n m $delete
  - bottom:
    - $symbols
    - type: base
      spec: '、|,'
      hint: 'ー'
      moreKeys: ['ー|-']
      attributes: { moreKeyMode: OnlyExplicit }
    - $action
    - $space
    - type: base
      spec: '。|.'
      hint: '？'
      moreKeys: ['？|?', '！|!']
      attributes: { moreKeyMode: OnlyExplicit }
    - $enter
