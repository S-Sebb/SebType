# SebType Picnic: Fcitx5's candidate window in the phone's Picnic colours (#72). Installed by the
# Configurator (主题 → 候选窗) into ~/.local/share/fcitx5/themes/sebtype-picnic. It sets the
# content's left margin, the room for SebType's pig at the start (logo.svg, #94), from the font size.
[Metadata]
Name=SebType Picnic
Name[zh_CN]=SebType Picnic
Version=1
Author=SebType
Description=Cream and pink, as SebType's keyboard
ScaleWithDPI=True

[InputPanel]
NormalColor=#4a2f22
HighlightCandidateColor=#ffffff
HighlightColor=#ffffff
HighlightBackgroundColor=#c2506a
PageButtonAlignment=Last Candidate

[InputPanel/TextMargin]
Left=6
Right=6
Top=4
Bottom=4

[InputPanel/ContentMargin]
Left=@LOGO_MARGIN@
Right=8
Top=7
Bottom=9

[InputPanel/Background]
Image=panel.svg
Overlay=logo.svg
Gravity=Center Left
OverlayOffsetX=9
OverlayOffsetY=-1

[InputPanel/Background/Margin]
Left=12
Right=12
Top=12
Bottom=14

[InputPanel/Highlight]
Image=highlight.svg

[InputPanel/Highlight/Margin]
Left=7
Right=7
Top=7
Bottom=7

[InputPanel/PrevPage]
Image=prev.svg

[InputPanel/PrevPage/ClickMargin]
Left=5
Right=5
Top=4
Bottom=4

[InputPanel/NextPage]
Image=next.svg

[InputPanel/NextPage/ClickMargin]
Left=5
Right=5
Top=4
Bottom=4

[Menu]
NormalColor=#4a2f22
HighlightCandidateColor=#4a2f22
Spacing=0

[Menu/Background]
Color=#fff7e8
BorderColor=#5b331c
BorderWidth=2

[Menu/Background/Margin]
Left=2
Right=2
Top=2
Bottom=2

[Menu/ContentMargin]
Left=2
Right=2
Top=2
Bottom=2

[Menu/Highlight]
Color=#fde0e6

[Menu/Highlight/Margin]
Left=5
Right=5
Top=5
Bottom=5

[Menu/Separator]
Color=#ecd0ae

[Menu/TextMargin]
Left=6
Right=6
Top=6
Bottom=6
