# SebType Picnic: Fcitx5's candidate window in the phone's Picnic colours (#72). Installed by the
# Configurator (主题 → 候选窗) into ~/.local/share/fcitx5/themes/sebtype-picnic. SebType's pig
# (logo.svg, #94) sits inside the box's top left corner, so the window is one flat rectangle (#461). Sizes
# are Windows' Picnic box's (candidate_layout.cpp, #447) for Noto Sans: 12 px round the rows, a 3 px border,
# the pinyin row's light pink and the page arrows at its end. The Configurator sizes the pig and the
# content's left margin from the font size.
[Metadata]
Name=SebType Picnic
Name[zh_CN]=SebType Picnic
Version=1
Author=SebType
Description=Cream and pink, as SebType's keyboard
ScaleWithDPI=True

[InputPanel]
NormalColor=#4a2f22
HighlightCandidateColor=#ffffff
HighlightColor=#4a2f22
HighlightBackgroundColor=#fde0e6
CandidateCommentColor=#73533f
HighlightCandidateCommentColor=#ffffff
CommentTextSizeFactor=100
PageButtonAlignment=Top

[InputPanel/TextMargin]
Left=3
Right=3
Top=4
Bottom=4

[InputPanel/ContentMargin]
Left=@CONTENT_LEFT@
Right=11
Top=7
Bottom=7

[InputPanel/Background]
Image=panel.svg
Overlay=logo.svg
Gravity=Top Left
OverlayOffsetX=12
OverlayOffsetY=12
HideOverlayIfOversize=True

[InputPanel/Background/Margin]
Left=6
Right=6
Top=6
Bottom=6

[InputPanel/Highlight]
Image=highlight.svg

[InputPanel/Highlight/Margin]
Left=2
Right=2
Top=2
Bottom=2

[InputPanel/PrevPage]
Image=prev.svg

[InputPanel/PrevPage/ClickMargin]
Left=4
Right=4
Top=6
Bottom=6

[InputPanel/NextPage]
Image=next.svg

[InputPanel/NextPage/ClickMargin]
Left=4
Right=4
Top=6
Bottom=6

[Menu]
NormalColor=#4a2f22
HighlightCandidateColor=#4a2f22
Spacing=0

[Menu/Background]
Color=#fff7e8
BorderColor=#5b331c
BorderWidth=2

[Menu/Background/Margin]
Left=2
Right=2
Top=2
Bottom=2

[Menu/ContentMargin]
Left=2
Right=2
Top=2
Bottom=2

[Menu/Highlight]
Color=#fde0e6

[Menu/Highlight/Margin]
Left=5
Right=5
Top=5
Bottom=5

[Menu/Separator]
Color=#ecd0ae

[Menu/TextMargin]
Left=6
Right=6
Top=6
Bottom=6
