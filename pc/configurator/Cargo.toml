[package]
name = "sebtype-configurator"
version = "0.1.0"
edition = "2021"
publish = false
description = "SebType Configurator: SebType's settings on Linux and Windows (#72)"

[dependencies]
# Only the winit backend with the OpenGL renderer: no Qt, one small binary on both systems.
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg", "accessibility"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
sys-locale = "0.3"
# The time of the last sync, in this PC's time zone.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# installation.yaml, read as Rime (yaml-cpp) reads it (#396).
yaml-rust2 = "0.13"
# An update's files, checked against the release's SHA-256 (#422).
sha2 = "0.10"

[features]
# The tests' builds only (build.sh's sebtype-configurator-update-test): SEBTYPE_UPDATE_URL, a release
# served on 127.0.0.1, in place of GitHub's (#422).
update-test = []

# The sync password (#180): Secret Service on Linux (libdbus built in, so no dbus-devel is needed),
# Credential Manager on Windows.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", features = ["sync-secret-service", "crypto-rust", "vendored"] }
# The update's notification (#422), on the libdbus keyring builds in.
dbus = "0.9"
[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }
# The update's admin side, passed to PowerShell as -EncodedCommand (#422).
base64 = "0.23"

[build-dependencies]
slint-build = "1.18"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
