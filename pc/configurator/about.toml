# cargo-about's settings (#548) for the licences of the crates built into the Configurator: what the release
# binary links, without dev or build-only crates. A crate that offers a choice takes the first it accepts.
# The builds (configurator.yml, linux/sebtype.spec) run it offline, so a crate that ships no licence file gets
# its licence's standard text.
accepted = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib",
  "Unicode-3.0", "BSL-1.0", "MPL-2.0", "CC0-1.0", "AFL-2.1", "LicenseRef-Slint-Royalty-free-2.0"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
private = { ignore = true }

# Slint's crates, under its Royalty-free licence (the Configurator shows Slint's About), whose text no licence
# list has: each crate's own copy. Its file names another licence than the crate's because cargo-about 0.9.3
# drops a clarified file whose licence is the crate's LicenseRef (generate.rs misses a `!`).
# i-slint-renderer-software is in the Windows build only.
slint.clarify = { license = "LicenseRef-Slint-Royalty-free-2.0", files = [{ path = "LICENSES/LicenseRef-Slint-Royalty-free-2.0.md", license = "LicenseRef-Slint-text", checksum = "5167f5056e850419106ab6265efbdca7cba4d99c849d1445ca0bbf6a1e2315fe" }] }
slint-macros.clarify = { license = "LicenseRef-Slint-Royalty-free-2.0", files = [{ path = "LICENSES/LicenseRef-Slint-Royalty-free-2.0.md", license = "LicenseRef-Slint-text", checksum = "5167f5056e850419106ab6265efbdca7cba4d99c849d1445ca0bbf6a1e2315fe" }] }
i-slint-backend-selector.clarify = { license = "LicenseRef-Slint-Royalty-free-2.0", files = [{ path = "LICENSES/LicenseRef-Slint-Royalty-free-2.0.md", license = "LicenseRef-Slint-text", checksum = "5167f5056e850419106ab6265efbdca7cba4d99c849d1445ca0bbf6a1e2315fe" }] }
i-slint-backend-winit.clarify = { license = "LicenseRef-Slint-Royalty-free-2.0", files = [{ path = "LICENSES/LicenseRef-Slint-Royalty-free-2.0.md", license = "LicenseRef-Slint-text", checksum = "5167f5056e850419106ab6265efbdca7cba4d99c849d1445ca0bbf6a1e2315fe" }] }
i-slint-common.clarify = { license = "LicenseRef-Slint-Royalty-free-2.0", files = [{ path = "LICENSES/LicenseRef-Slint-Royalty-free-2.0.md", license = "LicenseRef-Slint-text", checksum = "5167f5056e850419106ab6265efbdca7cba4d99c849d1445ca0bbf6a1e2315fe" }] }
