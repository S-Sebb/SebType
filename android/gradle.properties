org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.enableJetifier=false
android.useAndroidX=true
# SebType (#58): task outputs are reused from ~/.gradle's build cache (shared by every worktree), and the
# configured build is reused while build.gradle and its inputs stay the same.
org.gradle.caching=true
org.gradle.configuration-cache=true
# SebType (#229): R8 runs on the same number of threads everywhere. With yanglab16's 48 it marks one
# merged lambda's constructor in baseline.prof as not hot, with 6 or fewer as hot, so the APK differed.
android.r8.threadPoolSize=4
