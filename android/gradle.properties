org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.enableJetifier=false
android.useAndroidX=true
# SebType (#58): task outputs are reused from ~/.gradle's build cache (shared by every worktree), and the
# configured build is reused while build.gradle and its inputs stay the same.
org.gradle.caching=true
org.gradle.configuration-cache=true
# SebType (#229, #250): R8 runs on one thread. With several it sometimes marks one merged lambda's
# constructor (YamlMap$$ExternalSyntheticLambda0.<init>) in baseline.prof as not hot, so the APK differed:
# always with yanglab16's 48 threads, and in one of four builds there with 4.
android.r8.threadPoolSize=1
