// Rime for the phone: RimeJni's Kotlin API and JNI (by Astronot233, see NOTICE.md) built against
// engines/librime, the librime the PCs run, with librime-lua and octagram.
plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

final def repoRoot = rootDir.parentFile
final def depsCache = "${System.getProperty('user.home')}/scratch/SebType/cache/rime-android"

android {
    namespace 'icu.astronot233.rime'
    compileSdk 35
    ndkVersion '28.2.13676358'

    defaultConfig {
        minSdk 24
        consumerProguardFiles 'consumer-rules.pro'
        ndk {
            abiFilters(*(findProperty('sebtypeAbis') ?: 'arm64-v8a').split(','))
        }
        externalNativeBuild.cmake {
            // The third-party sources librime builds on are downloaded (pinned, checksum-checked) once into
            // a cache every worktree shares.
            arguments "-DLIBRIME_SOURCE_DIR=${repoRoot}/engines/librime",
                "-DRIME_DEPS_CACHE=${depsCache}",
                '-DCMAKE_BUILD_TYPE=Release'
            // SebType (#225): Ninja runs at most build.sh's BUILD_JOBS compiles at once (by default, one a core).
            if (findProperty('sebtypeJobs')) {
                arguments "-DCMAKE_JOB_POOLS=jobs=${findProperty('sebtypeJobs')}", '-DCMAKE_JOB_POOL_COMPILE=jobs', '-DCMAKE_JOB_POOL_LINK=jobs'
            }
            // Paths relative to the checkout and the deps cache, and no per-checkout compile folder (as in
            // app/build.gradle): the library is the same from every checkout (#223).
            final def prefixMaps = ["-ffile-prefix-map=${repoRoot}/=", "-ffile-prefix-map=${depsCache}/=rime-android/",
                                    "-ffile-prefix-map=${android.sdkDirectory}/=android-sdk/",
                                    '-ffile-compilation-dir=.']
            cFlags(*prefixMaps)
            cppFlags('-Wno-deprecated', '-fpermissive', '-fno-char8_t', *prefixMaps)
        }
    }
    buildTypes {
        // librime is slow unoptimized, so debug builds compile it as Release too (above).
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    externalNativeBuild {
        cmake {
            path 'src/main/jni/CMakeLists.txt'
        }
    }
}

dependencies {
    implementation 'androidx.annotation:annotation:1.7.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}
