// SebType's own keyboard (#191 stage 3), a test-only app beside app/ (dev.sebb.sebtype.next): its own
// code on core/ through :native, with no FUTO code.
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// The Chinese data (data/rime/build.sh, cached) and the two OFL fonts app/ ships, shared with it.
final def assetsDir = layout.buildDirectory.dir('sebtype-assets')
tasks.register('buildRimeData', Exec) {
    commandLine 'bash', file('../../data/rime/build.sh').absolutePath, assetsDir.get().asFile.absolutePath
}
// And SebType's pig (art/make-icon.py) for the launcher and the settings' header.
final def fontsDir = layout.buildDirectory.dir('generated/sebtype-fonts')
tasks.register('copyFonts', Sync) {
    from('../app/src/main/res') {
        include 'font/sebtype_*.ttf', 'mipmap-*/ic_launcher*', 'drawable/ic_launcher_foreground.xml',
            'values/ic_launcher_background.xml'
    }
    into fontsDir
}
// English's dictionary (data/en-dict) and SebType's model (engines/sebtype-lm), both stored uncompressed: the
// dictionary is read straight from the APK, the model copied out once (llama.cpp maps a file of its own).
final def englishDir = layout.buildDirectory.dir('generated/sebtype-english')
tasks.register('copyEnglish', Sync) {
    from('../../data/en-dict') { include 'en_US.dict' }
    from('../../engines/sebtype-lm') { include 'english.gguf' }
    into englishDir.map { it.dir('english') }
}
preBuild.dependsOn 'buildRimeData', 'copyFonts', 'copyEnglish'

android {
    namespace 'dev.sebb.sebtype.next'
    compileSdk 35
    ndkVersion '28.2.13676358'

    defaultConfig {
        // update-from-futo-app (#254) builds it as dev.sebb.sebtype, over today's app.
        applicationId findProperty('sebtypeAppId') ?: 'dev.sebb.sebtype.next'
        minSdk 24
        targetSdk 35
        versionCode((System.getenv('VERSION_CODE') ?: '1') as int)
        versionName System.getenv('VERSION_NAME') ?: 'next'
        ndk {
            abiFilters(*(findProperty('sebtypeAbis') ?: 'arm64-v8a').split(','))
        }
        resConfigs 'en', 'ja', 'zh-rCN'
    }
    buildFeatures {
        compose true
        buildConfig true
    }

    signingConfigs {
        debug {
            storeFile file('../app/shared.keystore')
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        // Built unsigned; build.sh signs it with SebType's key, as app/'s release.
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }

    sourceSets {
        main {
            res.srcDirs += ['../app/res-bundle', fontsDir] // Mozc's dictionary (build.sh downloads it); the fonts
            assets.srcDirs += [assetsDir, englishDir]
        }
    }

    androidResources {
        noCompress 'dict', 'zip', 'gguf' // Mozc and English read their dictionaries straight from the APK
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation project(':native')
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.customview:customview:1.1.0'
    // The settings app (#254): Compose loads only when it opens, never in the keyboard's window.
    implementation platform('androidx.compose:compose-bom:2025.06.00')
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.activity:activity-compose:1.9.1'
    implementation 'androidx.datastore:datastore-preferences:1.1.7'
    testImplementation 'junit:junit:4.13.2'
    // Inline autofill's chips (#53 B9)
    implementation 'androidx.autofill:autofill:1.1.0'
}
