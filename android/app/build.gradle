//file:noinspection HardCodedStringLiteral
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

def getVersionCode = { ->
    def envCode = System.getenv('VERSION_CODE')
    if (envCode?.trim()) {
        try {
            return Integer.parseInt(envCode.trim())
        } catch (NumberFormatException ignored) {
            project.logger.warn("VERSION_CODE='$envCode' is not a valid integer – falling back to git rev-list.")
        }
    } else {
        project.logger.warn("VERSION_CODE env variable not set – falling back to git rev-list.")
    }

    try {
        // SebType (#58): providers.exec, which the configuration cache allows at configuration time
        final def stdout = providers.exec { commandLine 'git', 'rev-list', '--first-parent', '--count', 'master' }.standardOutput.asText.get()
        return Integer.parseInt(stdout.trim())
    } catch (ignored) {
        project.logger.lifecycle("Failed to get rev-list count from git!")
        return -1
    }
}

def getVersionName = { ->
    def envName = System.getenv('VERSION_NAME')
    if (envName?.trim()) {
        return envName.trim()
    } else {
        project.logger.warn("VERSION_NAME env variable not set – falling back to git describe.")
    }

    try {
        // SebType (#58): providers.exec, which the configuration cache allows at configuration time
        final def stdout = providers.exec { commandLine 'git', 'describe', '--tags' }.standardOutput.asText.get()
        return stdout.trim()
    } catch (ignored) {
        project.logger.lifecycle("Failed to get version name tag from git!")
        return "0.0.0"
    }
}

tasks.register('updateLocales', Exec) {
    workingDir = file('../tools/make-keyboard-text-py')
    commandLine = [
            System.getProperty("os.name").toLowerCase().contains("windows") ? "python" : "python3",
            "src/generate.py"
    ]
}

tasks.register('updateContributors') {
    def script = file('../tools/contributors.py')
    def outputFile = file('src/main/java/org/futo/inputmethod/latin/uix/settings/pages/credits/Contributors.kt')

    inputs.file script
    outputs.file outputFile

    doLast {
        exec {
            environment 'GITHUB_TOKEN', System.getenv('GITHUB_TOKEN') ?: ''
            commandLine 'python3', script.absolutePath
        }
    }
}

preBuild.dependsOn updateLocales

// SebType: the Rime aar with Lua (../rime/), downloaded and checksum-checked, and the Chinese data,
// compiled from pinned sources (cached); neither is committed.
tasks.register('fetchRimeAar', Exec) {
    commandLine 'bash', file('../rime/fetch-aar.sh').absolutePath, file('../rime/out/rime-release.aar').absolutePath
}
tasks.register('buildRimeData', Exec) {
    commandLine 'bash', file('../../data/rime/build.sh').absolutePath, layout.buildDirectory.dir('sebtype-assets').get().asFile.absolutePath
}
preBuild.dependsOn buildRimeData

// Workaround (#62): the APK ships the NDK's libc++_shared.so, though nothing loads it. On the Nothing A001
// (Dimensity 7300, Android 16), the phone schedules SebType on its little cores without an extra native library,
// and English prediction takes 99 ms per key instead of 21 ms. With one, it usually uses the big cores: 7 of 8
// perf/perf.sh runs, against 0 of 3 without (#59).
final def sebtypeJniLibs = layout.buildDirectory.dir('generated/sebtype-jniLibs')
tasks.register('sebtypeJniLibs', Sync) {
    from(fileTree("${android.ndkDirectory}/toolchains/llvm/prebuilt").matching {
        include '*/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so'
    }.files)
    into sebtypeJniLibs.map { it.dir('arm64-v8a') }
}
preBuild.dependsOn 'sebtypeJniLibs'

android {
    namespace 'org.futo.inputmethod.latin'

    compileSdk 35

    // Required if using classes in android.test.runner
    useLibrary 'android.test.runner'

    // Required if using classes in android.test.base
    useLibrary 'android.test.base'

    // Required if using classes in android.test.mock
    useLibrary 'android.test.mock'

    defaultConfig {
        minSdk 24
        targetSdk 35
        versionName getVersionName()
        versionCode getVersionCode()

        // SebType: own application id so it installs next to stock FUTO; the Kotlin/Java package stays FUTO's.
        applicationId 'dev.sebb.sebtype'
        testApplicationId 'org.futo.inputmethod.latin.tests'
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = false

        // SebType ships arm64 only; -PsebtypeAbis=x86_64 builds for an emulator.
        ndk {
            abiFilters(*(findProperty('sebtypeAbis') ?: 'arm64-v8a').split(','))
        }
        // SebType (#58): native code names its source files relative to the checkout, so the libraries are
        // the same in every worktree and sccache (build.sh) can share objects between them.
        externalNativeBuild.cmake {
            cFlags "-ffile-prefix-map=${rootDir}/="
            cppFlags "-ffile-prefix-map=${rootDir}/="
        }
        // SebType speaks English, Chinese and Japanese only (#6); add 'ru' back with Russian.
        resConfigs 'en', 'ja', 'zh-rCN'
    }

    bundle {
        language {
            enableSplit = true
        }
    }

    signingConfigs {
        debug {
            storeFile file("shared.keystore")
        }
    }

    // SebType (#149, #178): a release APK or bundle is signed with SebType's registered key, which
    // build.sh passes for its run alone, or not built: never with shared.keystore (Android's
    // public test key). -PunsignedRelease builds it unsigned. Debug builds don't package these tasks.
    final def releaseKeystore = providers.environmentVariable('SEBTYPE_KEYSTORE').orNull
    def releaseSigning = null
    if (releaseKeystore) {
        final def password = providers.environmentVariable('SEBTYPE_KEYSTORE_PASSWORD').get()
        releaseSigning = signingConfigs.create("release") {
            storeFile file(releaseKeystore)
            storePassword password
            keyAlias 'sebtype'
            keyPassword password
        }
    } else if (!project.hasProperty('unsignedRelease')) {
        gradle.taskGraph.whenReady { graph ->
            if (graph.allTasks.any { it.name ==~ /package\w*Release(Bundle|UniversalApk)?/ }) {
                throw new GradleException("Release builds need SEBTYPE_KEYSTORE and SEBTYPE_KEYSTORE_PASSWORD (android/build.sh release sets them); pass -PunsignedRelease for an unsigned APK")
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled true
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig releaseSigning
        }

        buildTypes.each {
            //it.buildConfigField "String", "FUTOPAY_URL", "\"https://pay.futo.org/api/PaymentPortal?product=voiceinput&success=futo-keyboard%3a%2f%2flicense%2factivate\""
            it.buildConfigField "String", "FUTOPAY_URL", "\"https://pay2.futo.org/checkout/polar/futo-keyboard/futo-keyboard-voiceinput/checkout-ready?success=redirect-to-organization-page\""
            it.buildConfigField "String", "FUTOPAY_PRICE", "\"~\$6.99\""

            it.buildConfigField "String", "GOOGLEPAY_URL", "\"https://play.google.com/store/apps/details?id=org.futo.keyboardpayment\""
            it.buildConfigField "String", "GOOGLEPAY_PRICE", "\"~\$11.99\""

            // FUTO's non-Play Store payment screen, unchanged (FUTO's licence, #53); FLAVOR is the one it
            // was built as before SebType dropped the flavors (#178).
            it.buildConfigField "String", "FLAVOR", "\"stable\""
            it.buildConfigField "boolean", "IS_PLAYSTORE_BUILD", "false"
            it.buildConfigField "String", "PAYMENT_PRICE", "FUTOPAY_PRICE"
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    sourceSets {
        main {
            res.srcDirs += 'res-bundle' // Mozc's dictionary, downloaded by build.sh
            jniLibs.srcDirs = [sebtypeJniLibs] // the unused libc++_shared.so (#62)
            assets.srcDirs += layout.buildDirectory.dir('sebtype-assets') // the bundled Chinese data
        }
    }

    lintOptions {
        checkReleaseBuilds false
    }

    aaptOptions {
        noCompress 'dict', 'zip'
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    ndkVersion '28.2.13676358'
    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
        }
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        compose true
        viewBinding true
        mlModelBinding true
        buildConfig true
    }
}

