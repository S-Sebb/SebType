// SebType's keyboard app (#191): its own code on core/ through :native.
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// The Chinese data (data/rime/build.sh, cached).
final def assetsDir = layout.buildDirectory.dir('sebtype-assets')
tasks.register('buildRimeData', Exec) {
    commandLine 'bash', file('../../data/rime/build.sh').absolutePath, assetsDir.get().asFile.absolutePath
}
// Mozc's Japanese dictionary (mozc-dictionary.sh, cached), a raw resource for 日本語.
final def mozcDictDir = layout.buildDirectory.dir('generated/mozc-dictionary')
tasks.register('mozcDictionary', Exec) {
    commandLine 'bash', file('mozc-dictionary.sh').absolutePath, mozcDictDir.get().asFile.absolutePath
}
// English's dictionary (data/en-dict) and SebType's model (engines/sebtype-lm), both stored uncompressed: the
// dictionary is read straight from the APK, the model copied out once (llama.cpp maps a file of its own).
final def englishDir = layout.buildDirectory.dir('generated/sebtype-english')
tasks.register('copyEnglish', Sync) {
    from('../../data/en-dict') { include 'en_US.dict' }
    from('../../engines/sebtype-lm') { include 'english.gguf' }
    into englishDir.map { it.dir('english') }
}
// The licence texts of what the app ships that :native's assets/licenses doesn't hold, copied from where the
// repository keeps them; Settings › About › Licence and credits shows them (credits.tsv names each row's).
final def licencesDir = layout.buildDirectory.dir('generated/sebtype-licences')
tasks.register('copyLicences', Sync) {
    dependsOn 'buildRimeData'
    from('../../engines/mozc/LICENSE') { rename { 'Mozc-LICENSE.txt' } }
    from('../../engines/mozc/src/data/dictionary_oss/README.txt') { rename { 'Mozc-dictionary-LICENSE.txt' } }
    from('../../art/fonts') {
        include 'OFL-Nunito.txt', 'OFL-PixelifySans.txt'
        rename { it.replace('OFL-', '').replace('.txt', '-OFL.txt') }
    }
    from('../../LICENSE-LGPL-2.1') { rename { 'LGPL-2.1.txt' } }
    from('../../LICENSE-SebType') { rename { 'SebType-LICENSE.txt' } }
    from('../../NOTICE') { rename { 'SebType-NOTICE.txt' } }
    // AOSP's notice without its copyright line: the plain Apache License 2.0, for the other Apache-2.0 parts
    from('../../engines/latinime/NOTICE') {
        rename { 'Apache-2.0.txt' }
        def started = false
        filter { line -> started = started || line.trim() == 'Apache License'; started ? line : null }
    }
    // The Chinese data's own: rime-ice's and 白霜's GPL-3.0 and what was taken from each
    from({ zipTree(assetsDir.get().file('rime/rime-data.zip')) }) {
        include 'LICENSE', 'SOURCE.txt'
        rename { it == 'LICENSE' ? 'Rime-data-GPL-3.0.txt' : 'Rime-data-SOURCE.txt' }
    }
    into licencesDir.map { it.dir('licenses') }
}
preBuild.dependsOn 'buildRimeData', 'mozcDictionary', 'copyEnglish', 'copyLicences'

android {
    namespace 'dev.sebb.sebtype'
    compileSdk 35
    ndkVersion '28.2.13676358'

    defaultConfig {
        applicationId 'dev.sebb.sebtype'
        minSdk 24
        targetSdk 35
        versionCode((System.getenv('VERSION_CODE') ?: '1') as int)
        versionName System.getenv('VERSION_NAME') ?: 'dev'
        ndk {
            abiFilters(*(findProperty('sebtypeAbis') ?: 'arm64-v8a').split(','))
        }
        resConfigs 'en', 'ja', 'zh-rCN'
    }
    buildFeatures {
        compose true
        buildConfig true
    }

    signingConfigs {
        debug {
            storeFile file('shared.keystore')
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        // Built unsigned; build.sh signs it with SebType's key.
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }

    sourceSets {
        main {
            res.srcDirs += [mozcDictDir]
            assets.srcDirs += [assetsDir, englishDir, licencesDir]
        }
    }

    androidResources {
        noCompress 'dict', 'zip', 'gguf' // Mozc and English read their dictionaries straight from the APK
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    // The JVM tests' fake field answers getExtractedText with Android's own ExtractedText, a stub there
    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation project(':native')
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.customview:customview:1.1.0'
    // The settings app (#254): Compose loads only when it opens, never in the keyboard's window.
    implementation platform('androidx.compose:compose-bom:2025.06.00')
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.activity:activity-compose:1.9.1'
    implementation 'androidx.datastore:datastore-preferences:1.1.7'
    testImplementation 'junit:junit:4.13.2'
    // The clipboard's file in the JVM tests: Android's org.json is only a stub there
    testImplementation 'org.json:json:20240303'
    // Inline autofill's chips (#53 B9)
    implementation 'androidx.autofill:autofill:1.1.0'
}
