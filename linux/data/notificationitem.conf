# SebType's tray item in place of Fcitx5's (linux/src/tray.h): setup-ime.sh links this into the user's
# Fcitx5 add-on folder, where it takes the place of Fcitx5's own entry of the same name.
[Addon]
Name=SebType tray
Comment=SebType's tray icon and menu
Type=SharedLibrary
Library=sebtype
Category=Module
Version=1.0
OnDemand=True

[Addon/Dependencies]
0=core:5.1.0
1=dbus
