# FUTO's upstream Python: never lint or reformat it, so upstream merges stay clean.
force-exclude = true
# SebType's Weasel, librime, Mozc, fcitx5-rime and Fcitx5 keep upstream's code style.
extend-exclude = ["java", "tools/contributors.py", "tools/make-keyboard-text-py", "pc/weasel", "pc/librime",
  "pc/mozc", "pc/fcitx5-rime", "pc/fcitx5"]
